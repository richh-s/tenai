# ══════════════════════════════════════════════════════════════════════════════
# LAUNCH ARGS (appended to gemini command when dispatching agents)
# ══════════════════════════════════════════════════════════════════════════════

launch_args:
  - "--yolo"

# ══════════════════════════════════════════════════════════════════════════════
# HOOKS — Automation scripts triggered at lifecycle events
#
# Format: JSON in ~/.gemini/settings.json under "hooks" key
# Source: config/cli/hooks/gemini_hooks.json (merged into settings.json)
#
# Event reference:
#   SessionStart       — session begins
#   SessionEnd         — session ends
#   BeforeAgent        — before agent processes a request
#   AfterAgent         — after agent completes
#   BeforeModel        — before model call
#   AfterModel         — after model response
#   BeforeToolSelection — before tool selection
#   BeforeTool         — before a tool runs (can deny)
#   AfterTool          — after a tool completes
#   PreCompress        — before context compaction
#   Notification       — when CLI needs user attention
# ══════════════════════════════════════════════════════════════════════════════

hooks:
  source: "config/cli/hooks/gemini_hooks.json"
  # Recommended hooks (enabled by default):
  #   - notify          — OS notification when Gemini needs input
  #   - protect-files   — block edits to .env, lockfiles, .git/
  #   - post-compact    — re-inject critical context before compression
  #   - audit-log       — log tool usage for debugging

# ══════════════════════════════════════════════════════════════════════════════
# SETTINGS (merged into ~/.gemini/settings.json)
# ══════════════════════════════════════════════════════════════════════════════

settings:
  general:
    defaultApprovalMode: "auto_edit"
  security:
    enablePermanentToolApproval: true

# ══════════════════════════════════════════════════════════════════════════════
# RULES (copied to ~/.gemini/GEMINI.md if not present)
# ══════════════════════════════════════════════════════════════════════════════

rules:
  source: "config/cli/rules/global_gemini.md"
