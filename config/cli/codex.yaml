# Codex CLI Configuration
# Managed by: scripts/install/cli_setup.sh
# Targets:    make cli-setup CLI=codex | make cli-mcp | make cli-skills | etc.

# ══════════════════════════════════════════════════════════════════════════════
# MCP SERVERS (codex --mcp-config .codex/mcp.json)
# ══════════════════════════════════════════════════════════════════════════════

mcp_servers:
  # ── Essential ──
  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]
    description: "Up-to-date library docs in context"

  - name: sequential-thinking
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    description: "Structured problem decomposition and reasoning"

  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "~"]
    description: "Controlled file system access (read/write/search)"

  - name: github
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    description: "GitHub repos, issues, PRs, code search"

  # ── Optional ──
  # - name: puppeteer
  #   command: npx
  #   args: ["-y", "@anthropic/mcp-server-puppeteer"]
  #   description: "Browser automation and screenshots"
  # - name: brave-search
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-brave-search"]
  #   description: "Web search via Brave Search API"

# ══════════════════════════════════════════════════════════════════════════════
# SKILLS (stored in .codex/skills/{name}/SKILL.md)
# Codex discovers skills automatically from ~/.codex/skills/ and .codex/skills/
# Skills can be invoked explicitly ($skill-name) or implicitly by description match
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# PLUGINS (git-cloned to ~/.codex/skills/{name}/ for Codex to discover)
# ══════════════════════════════════════════════════════════════════════════════

plugins:
  - name: conductor
    url: "https://github.com/get10acious/conductor"
    description: "Task planning — spec→plan→implement lifecycle"

skills:
  # ── Tenai Built-in ──
  - name: validate-tasks
    source: ".codex/skills/validate-tasks"
    description: "ATC compliance validation for TASKS.md"

  - name: proof-of-work
    source: ".codex/skills/proof-of-work"
    description: "Generate PROOF.md after completing a worktree task"

# ══════════════════════════════════════════════════════════════════════════════
# VERCEL SKILLS (installed via: npx skills add <package>)
# Cross-CLI — works with codex, claude-code, gemini-cli, cursor, etc.
# ══════════════════════════════════════════════════════════════════════════════

vercel_skills:
  # ── Available in anthropics/skills repo ──
  - name: webapp-testing
    package: "anthropics/skills/webapp-testing"
    description: "Web application testing strategies"

  - name: mcp-builder
    package: "anthropics/skills/mcp-builder"
    description: "Build MCP servers and integrations"

  - name: skill-creator
    package: "anthropics/skills/skill-creator"
    description: "Create new Vercel Skills"

  - name: pdf
    package: "anthropics/skills/pdf"
    description: "PDF document processing"

  - name: docx
    package: "anthropics/skills/docx"
    description: "Word document processing"

  - name: xlsx
    package: "anthropics/skills/xlsx"
    description: "Excel spreadsheet processing"

  # ── Optional ──
  # - name: pptx
  #   package: "anthropics/skills/pptx"
  #   description: "PowerPoint processing"
  # - name: frontend-design
  #   package: "anthropics/skills/frontend-design"
  #   description: "UI/UX design patterns"

# ══════════════════════════════════════════════════════════════════════════════
# LAUNCH ARGS (appended to codex command when dispatching agents)
# ══════════════════════════════════════════════════════════════════════════════

launch_args:
  - "--full-auto"

# ══════════════════════════════════════════════════════════════════════════════
# HOOKS — Automation scripts triggered at lifecycle events
#
# Format: JSON in ~/.codex/hooks.json or <repo>/.codex/hooks.json
# Source: config/cli/hooks/codex_hooks.json
#
# NOTE: Codex hooks require feature flag in config.toml:
#   [features]
#   codex_hooks = true
#
# Event reference:
#   SessionStart       — session start / resume
#   PreToolUse         — before a tool runs (can block)
#   PostToolUse        — after a tool completes
#   UserPromptSubmit   — when user submits a prompt
#   Stop               — when a turn ends
# ══════════════════════════════════════════════════════════════════════════════

hooks:
  source: "config/cli/hooks/codex_hooks.json"
  # Recommended hooks (enabled by default):
  #   - protect-files   — block edits to .env, lockfiles, .git/
  #   - post-compact    — re-inject critical context on session start
  #   - audit-log       — log tool usage for debugging

# ══════════════════════════════════════════════════════════════════════════════
# SETTINGS & RULES
# ══════════════════════════════════════════════════════════════════════════════

settings: {}

rules:
  source: "AGENTS.md"
  # Codex reads AGENTS.md automatically from repo root
  # Additional rules can be placed in .codex/AGENTS.md or subdirectory AGENTS.md

# Note: AGENTS.override.md can be used in subdirectories to completely replace
# parent instructions. Useful for monorepos with distinct sub-project conventions.
