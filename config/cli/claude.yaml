# ══════════════════════════════════════════════════════════════════════════════
# SKILLS (copied to ~/.claude/skills/ or .agents/skills/)
# ══════════════════════════════════════════════════════════════════════════════

skills:
  - name: validate-tasks
    source: ".claude/commands"
  - name: proof-of-work
    source: ".claude/commands"
  - name: implement-task
    source: ".claude/commands"

# ══════════════════════════════════════════════════════════════════════════════
# LAUNCH ARGS (appended to claude command when dispatching agents)
# ══════════════════════════════════════════════════════════════════════════════

launch_args:
  - "--dangerously-skip-permissions"
  - "--channels plugin:telegram@claude-plugins-official"

# ══════════════════════════════════════════════════════════════════════════════
# HOOKS — Automation scripts triggered at lifecycle events
#
# Format: JSON in ~/.claude/settings.json under "hooks" key
# Source: config/cli/hooks/claude_hooks.json
#
# Event reference:
#   SessionStart       — session start / resume / compact
#   PreToolUse         — before a tool runs (can block)
#   PostToolUse        — after a tool completes
#   PostToolUseFailure — after a tool fails
#   Notification       — when Claude needs user attention
#   PermissionRequest  — when Claude needs permission (can auto-approve)
#   Stop / StopFailure — when a turn ends
#   ConfigChange       — when settings change
#   PreCompact         — before context compaction
#   PostCompact        — after context compaction
# ══════════════════════════════════════════════════════════════════════════════

hooks:
  source: "config/cli/hooks/claude_hooks.json"
  # Individual hooks are defined in the JSON file.
  # Recommended hooks (enabled by default):
  #   - notification    — OS notification when Claude needs input
  #   - protect-files   — block edits to .env, lockfiles, .git/
  #   - post-compact    — re-inject critical context after compaction
  #   - audit-log       — log tool usage for debugging
  #
  # Optional hooks (disabled in JSON, uncomment to enable):
  #   - auto-format     — run prettier after file edits
  #   - auto-approve-plan — auto-approve ExitPlanMode permission

# ══════════════════════════════════════════════════════════════════════════════
