# Claude Code Configuration
# Managed by: scripts/install/cli_setup.sh
# Targets:    make cli-setup CLI=claude | make cli-mcp | make cli-plugins | etc.

# ══════════════════════════════════════════════════════════════════════════════
# MCP SERVERS (claude mcp add {name} -- {command} {args...})
# ══════════════════════════════════════════════════════════════════════════════

mcp_servers:
  # ── Essential ──
  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]
    description: "Up-to-date library docs in context"

  - name: sequential-thinking
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    description: "Structured problem decomposition and reasoning"

  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "~"]
    description: "Controlled file system access (read/write/search)"

  - name: github
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    description: "GitHub repos, issues, PRs, code search"

  # ── Optional ──
  # - name: puppeteer
  #   command: npx
  #   args: ["-y", "@anthropic/mcp-server-puppeteer"]
  #   description: "Browser automation and screenshots"
  # - name: postgres
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-postgres"]
  #   description: "PostgreSQL schema inspection and queries"
  # - name: memory
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-memory"]
  #   description: "Knowledge graph memory across sessions"
  # - name: brave-search
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-brave-search"]
  #   description: "Web search via Brave Search API"
  # - name: slack
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-slack"]
  #   description: "Slack channel access and messaging"

# ══════════════════════════════════════════════════════════════════════════════
# PLUGINS
#
# Two install modes:
#   1. Git-based:        url + marketplace.json auto-discovery
#      → claude plugin marketplace add <url> && claude plugin install <name>@<marketplace>
#   2. Marketplace:      marketplace_repo + plugin_id (no git clone needed)
#      → claude plugin marketplace add <marketplace_repo> && claude plugin install <plugin_id>
# ══════════════════════════════════════════════════════════════════════════════

plugins:
  # ── Git-based plugins ──
  - name: conductor
    url: "https://github.com/get10acious/conductor"
    description: "Task planning — spec→plan→implement lifecycle"

  # ── Marketplace plugins ──
  - name: telegram
    marketplace: "claude-plugins-official"
    marketplace_repo: "https://github.com/anthropics/claude-plugins-official"
    plugin_id: "telegram@claude-plugins-official"
    description: "Telegram channel plugin for Claude"
    # Requires: TELEGRAM_BOT_TOKEN in .env
    # Sender pairing is automated during channel setup

  # ── Optional marketplace plugins ──
  # - name: discord
  #   marketplace: "claude-plugins-official"
  #   marketplace_repo: "https://github.com/anthropics/claude-plugins-official"
  #   plugin_id: "discord@claude-plugins-official"
  #   description: "Discord channel plugin for Claude"

  # - name: imessage
  #   marketplace: "claude-plugins-official"
  #   marketplace_repo: "https://github.com/anthropics/claude-plugins-official"
  #   plugin_id: "imessage@claude-plugins-official"
  #   description: "iMessage channel plugin for Claude (macOS only)"

